---
name: Marble GKI Prototype CI

on:
  push:
    branches: [main]
    tags: ["marble-*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: marble-gki-prototype-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  review:
    name: Script and patch review
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09  # v5.0.0
        with:
          fetch-depth: 0

      - name: Validate scripts and whitespace
        shell: bash
        run: |
          set -euo pipefail
          bash -n build_marble_gki_6_18_proto.sh
          bash -n tools/verify_marble_gki_prototype.sh
          bash -n tools/create_marble_gki_evidence.sh
          bash -n tools/verify_marble_gki_evidence.sh
          bash -n tools/test_verify_marble_gki_evidence.sh
          if git rev-parse --verify HEAD^ >/dev/null 2>&1; then
            git diff --check HEAD^..HEAD
          fi

      - name: Check the changed commit
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${GITHUB_EVENT_NAME}" == "pull_request" ]]; then
            range="${{ github.event.pull_request.base.sha }}..${GITHUB_SHA}"
          elif git rev-parse --verify HEAD^ >/dev/null 2>&1; then
            range="HEAD^..HEAD"
          else
            echo "No parent commit is available; skipping range-based checkpatch."
            exit 0
          fi
          patch="$(mktemp)"
          git diff --no-ext-diff --unified=1 "$range" -- '*.c' '*.h' > "$patch"
          if [[ -s "$patch" ]]; then
            scripts/checkpatch.pl --strict "$patch"
          else
            echo "No C or header changes in range; checkpatch not required."
          fi

  build:
    name: Build and verify arm64 prototype
    needs: review
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - name: Check out source
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09  # v5.0.0
        with:
          fetch-depth: 1

      - name: Install build prerequisites
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            bc bison clang cpio flex libdw-dev libelf-dev libncurses-dev \
            libssl-dev llvm lld make pahole

      - name: Validate upstream arm64 GKI configuration
        shell: bash
        run: |
          set -euo pipefail
          export GKI_OUT="${RUNNER_TEMP}/gki-defconfig"
          make O="${GKI_OUT}" ARCH=arm64 LLVM=1 LLVM_IAS=1 gki_defconfig
          test -s "${GKI_OUT}/.config"
          grep -Fqx 'CONFIG_ARM64=y' "${GKI_OUT}/.config"

      - name: Build the non-flashable prototype
        shell: bash
        run: |
          set -euo pipefail
          export OUT_DIR="${RUNNER_TEMP}/marble-gki-prototype"
          export JOBS=2
          ./build_marble_gki_6_18_proto.sh | tee "${RUNNER_TEMP}/marble-gki-build.log"
          sha256sum "${OUT_DIR}/arch/arm64/boot/Image" > "${RUNNER_TEMP}/Image.sha256"

      - name: Create non-flashable build evidence
        shell: bash
        run: |
          set -euo pipefail
          export OUT_DIR="${RUNNER_TEMP}/marble-gki-prototype"
          export EVIDENCE_DIR="${RUNNER_TEMP}/marble-gki-evidence"
          export BUILD_LOG="${RUNNER_TEMP}/marble-gki-build.log"
          ./tools/create_marble_gki_evidence.sh

      - name: Verify non-flashable build evidence
        shell: bash
        run: |
          set -euo pipefail
          ./tools/verify_marble_gki_evidence.sh \
            "${RUNNER_TEMP}/marble-gki-evidence/marble-gki-source-build-evidence.tar.gz" \
            "${RUNNER_TEMP}/marble-gki-evidence/marble-gki-source-build-evidence.tar.gz.sha256"

      - name: Run evidence-verifier negative tests
        shell: bash
        run: |
          set -euo pipefail
          ./tools/test_verify_marble_gki_evidence.sh \
            "${RUNNER_TEMP}/marble-gki-evidence/marble-gki-source-build-evidence.tar.gz" \
            "${RUNNER_TEMP}/marble-gki-evidence/marble-gki-source-build-evidence.tar.gz.sha256"

      - name: Attest release evidence
        if: startsWith(github.ref, 'refs/tags/marble-')
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6  # v4.2.2
        with:
          subject-path: "${{ runner.temp }}/marble-gki-evidence/marble-gki-source-build-evidence.tar.gz"

      - name: Upload source-build evidence
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4  # v5.0.0
        with:
          name: marble-gki-prototype-${{ github.sha }}
          if-no-files-found: error
          retention-days: 7
          path: |
            ${{ runner.temp }}/gki-defconfig/.config
            ${{ runner.temp }}/marble-gki-prototype/.config
            ${{ runner.temp }}/marble-gki-prototype/build-metadata.txt
            ${{ runner.temp }}/marble-gki-build.log
            ${{ runner.temp }}/Image.sha256
            ${{ runner.temp }}/marble-gki-evidence/marble-gki-source-build-evidence.tar.gz
            ${{ runner.temp }}/marble-gki-evidence/marble-gki-source-build-evidence.tar.gz.sha256
